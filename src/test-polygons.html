<!DOCTYPE html>
<html>
<head>
  <title>Polygon Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Svalbard 12NM coordinates from territorial.ts
    const SVALBARD_12NM = [
      [76.0, 10.0],
      [76.5, 12.0],
      [77.5, 14.0],
      [78.5, 16.0],
      [79.5, 18.0],
      [80.5, 20.0],
      [81.0, 22.0],
      [81.0, 28.0],
      [80.5, 30.0],
      [79.5, 32.0],
      [78.5, 33.0],
      [77.0, 34.0],
      [76.0, 33.0],
      [75.5, 30.0],
      [76.0, 25.0],
      [76.5, 20.0],
      [77.0, 15.0],
      [76.0, 10.0],
    ];

    // Norway Mainland 12NM
    const NORWAY_MAINLAND_12NM = [
      [58.0, 4.0],
      [71.5, 4.0],
      [71.5, 31.0],
      [58.0, 31.0],
      [58.0, 4.0],
    ];

    // Create map centered on Svalbard
    const map = L.map('map').setView([78.2, 15.6], 5);

    // Add base layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CartoDB',
      maxZoom: 19
    }).addTo(map);

    // Draw Svalbard polygon
    const svalbardPoly = L.polygon(SVALBARD_12NM, {
      color: '#ff0000',
      fillColor: '#ff0000',
      fillOpacity: 0.3,
      weight: 4,
      opacity: 1.0
    }).addTo(map);

    svalbardPoly.bindPopup('<strong>Territorial Waters - Svalbard (12NM)</strong>');

    // Draw Norway Mainland polygon
    const norwayPoly = L.polygon(NORWAY_MAINLAND_12NM, {
      color: '#00ff00',
      fillColor: '#00ff00',
      fillOpacity: 0.3,
      weight: 4,
      opacity: 1.0
    }).addTo(map);

    norwayPoly.bindPopup('<strong>Territorial Waters - Norway Mainland (12NM)</strong>');

    console.log('✅ Polygons drawn:', {
      svalbard: SVALBARD_12NM.length + ' coordinates',
      norway: NORWAY_MAINLAND_12NM.length + ' coordinates'
    });

    // Fit map to show both polygons
    const group = L.featureGroup([svalbardPoly, norwayPoly]);
    map.fitBounds(group.getBounds());
  </script>
</body>
</html>
